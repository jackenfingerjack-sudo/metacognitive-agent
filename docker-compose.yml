services:
  agent:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - METACOG_HOME=/data
      - SKILLS_DIR=/app/skills
    volumes:
      - agent_data:/data
      - ./skills:/app/skills
volumes:
  agent_data:
